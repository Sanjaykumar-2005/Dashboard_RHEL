# Streamlit configuration — dark theme + server settings
[theme]
base = "dark"
primaryColor = "#76b900"            # NVIDIA green
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161a23"
textColor = "#e6e6e6"
font = "monospace"

# Sidebar styling via the theme (Streamlit >= 1.45 honours this; older versions
# ignore the unknown keys harmlessly).  Belt-and-suspenders with the CSS in
# utils/ui.py so the sidebar stays distinct from the page background regardless
# of the installed Streamlit version's internal DOM.
[theme.sidebar]
backgroundColor = "#11151d"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"            # we refresh manually every 1s; no file watching needed
enableXsrfProtection = true
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false   # replaced by the single "Analytics" dropdown in utils/ui.py
